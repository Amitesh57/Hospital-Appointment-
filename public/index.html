<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="newcss.css">
</head>

<body>
    <form id="appointmentForm">
        <header>
            <div class="container 1">
                <div class="carename">
                    <h1>HealthCare Appointments
                    </h1>
                </div>
                <DIV class="slogan">Secure, intuitive online appointments that save time and empower patients.</DIV>
            </div>
        </header>
        <main>
            <div class="container2">
                <div class="name">
                    <label for="name">NAME</label>
                    <input type="text" name="name" id="" placeholder="Enter your name" required>
                </div>
                <div class="gender" >
                    <label for="gender">GENDER</label>
                    <select name="gender" id="genderbox" required>
                        <option value="">select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">other</option>
                    </select>
                </div>
                <div class="dob">
                    <label for="birth">BIRTH</label>
                    <input type="date" name="birth" id="birth" required>
                </div>
                <div class="age">
                    <label for="ageNo">AGE</label>
                    <input type="text" placeholder="Enter your age" id="ageNo" readonly >
                </div>
                <div class="doctor">
                    <label for="doctor">DOCTOR</label>
                    <select name="doctor" id="" required>
                        <option value="">select</option>
                        <option value="dco1">ASHISH KHARE</option>
                        <option value="doc2">SUNIL RAJAN</option>
                        <option value="doc3"></option>
                    </select>
                </div>
                <div class="reserve">
                    <label for="date">DATE</label>
                    <input type="date" name="date" id="date" required>
                </div>
                <div class="time">
                    <label for="time-slot">Sutaible Time</label>
                    <select name="time" id="time-slot" required>
                        <option value="">Select</option>
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="2:00 PM">2:00 PM</option>
                    </select>
                </div>
                <div class="reason_id"></div>
                <label for="Symptoms">Reason for Visit / Symptoms</label>
                <input type="text" name="reason" id="reason" placeholder="Enter reason for appointment" required>
            </div>

            <div class="container3">
                <button type="submit">submit</button>
                <button>clear</button>
                <button id="logoutButton">Logout</button>
            </div>
            </div>
        </main>
    </form>
    <script src="script.js"></script>
</body>

</html>
