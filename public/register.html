<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Hospital Appointment</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="container1">
        <div class="logo"><h2>Register</h2></div>
        <form id="registerForm">
            <div class="name">
                <label class="input-label" for="username">Username</label>
                <input class="input-username" type="text" id="username" name="username" required>
            </div>
            <div class="pass">
                <label class="input-label" for="password">Password</label>
                <input class="input-password" type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="register-btn">Register</button>
            <div class="create">
                <p>Already have an account? <a href="/login.html">Login here</a></p>
            </div>
        </form>
    </div>
    <script src="register.js"></script>
</body>
</html>
